schema_version: q1.mixture-model.v1
task_id: T-Q1-003-MIXTURE
status: SPEC_ONLY
source:
  mixture_loss_pairs:
    fit: [A4, A5]
    validation: [A6, A7, A8, A9, A10, A11]
    extrapolation_only: [A12, A13, A14, A15]
  mapping_reference: A16
  raw_root: data/origin/real_attachments
response:
